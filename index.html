<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Play</title>
    <style>
        :root {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #17354d;
            background: #eaf3fb;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: radial-gradient(circle at top, #ffffff 0%, #dbe9f8 55%, #d3e5f5 100%);
        }

        .dice-card {
            width: min(540px, 100%);
            padding: 2rem 2.2rem;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(37, 93, 153, 0.12);
            box-shadow: 0 24px 60px rgba(25, 67, 116, 0.12);
            text-align: center;
        }

        .dice-card h1 {
            margin: 0.75rem 0 0.25rem;
            font-size: clamp(2rem, 2.3vw, 2.8rem);
            letter-spacing: -0.04em;
        }

        .dice-card p {
            margin: 0;
            color: #4f6b8b;
            font-size: 1rem;
            line-height: 1.6;
        }

        .dice-button {
            position: relative;
            z-index: 2;
            margin-top: 1.8rem;
            padding: 1rem 1.9rem;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #4b9cff, #1e64d7);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
            box-shadow: 0 16px 28px rgba(30, 91, 168, 0.24);
        }

        .dice-button:hover,
        .dice-button:focus-visible {
            transform: translateY(-2px);
            filter: saturate(1.08);
            outline: none;
        }

        .dice-button:active {
            transform: translateY(0);
            box-shadow: 0 12px 20px rgba(30, 91, 168, 0.18);
        }

        .dice-frame {
            position: relative;
            z-index: 1;
            width: min(320px, 100%);
            margin: 2.2rem auto 0;
            border-radius: 22px;
            border: 1px solid rgba(23, 53, 77, 0.08);
            box-shadow: 0 18px 40px rgba(23, 53, 77, 0.1);
            background: #f8fbff;
            padding: 1rem;
            display: grid;
            place-items: center;
            transition: transform 250ms ease;
        }

        .dice-frame.rolling {
            animation: rollDice 0.7s ease-in-out;
        }

        .dice-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: block;
            border-radius: 18px;
            transition: opacity 250ms ease;
            opacity: 1;
        }

        .dice-image[src=""] {
            opacity: 0;
            visibility: hidden;
        }

        @keyframes rollDice {
            0% {
                transform: rotate(0deg) scale(1);
            }
            20% {
                transform: rotate(50deg) scale(1.02);
            }
            50% {
                transform: rotate(180deg) scale(1.06);
            }
            80% {
                transform: rotate(320deg) scale(1.03);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        @media (max-width: 440px) {
            .dice-card {
                padding: 1.5rem 1.25rem;
            }

            .dice-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <section class="dice-card">
        <h1>Dice Play</h1>
        <p>Click the button to roll a friendly dice and watch the result appear. Every roll is a fresh surprise!</p>
        <button class="dice-button">Play Dice</button>
        <div class="dice-frame">
            <img class="dice-image" src="" alt="Dice face">
        </div>
    </section>
</body>
<script>
    const button = document.querySelector('.dice-button');
    const headOne = document.querySelector('h1');
    const diceFrame = document.querySelector('.dice-frame');
    const img = document.querySelector('.dice-image');

    button.addEventListener('click', () => {
        const random = Math.ceil(Math.random() * 6);
        const diceMap = {
            1: 'Dice 1 Big.png',
            2: 'Dice 2.png',
            3: 'Dice 3.png',
            4: 'Dice 4.png',
            5: 'Dice 5.png',
            6: 'Dice 6.png'
        };

        diceFrame.classList.add('rolling');
        button.disabled = true;
        button.textContent = 'Rolling...';

        setTimeout(() => {
            img.src = diceMap[random];
            diceFrame.classList.remove('rolling');
            headOne.textContent = random;
            button.disabled = false;
            button.textContent = 'Play Dice';
        }, 650);



        // let random = Math.random()*6
        //  randomWithoutdec = Math.ceil (random)
        // console.log(randomWithoutdec);

        // console.log(Math.random()*6)
    });
</script>
</html>
